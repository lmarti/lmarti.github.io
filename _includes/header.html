<header class="site-header">
  <a class="site-name" href="/">{{ site.title }}</a>
  <nav class="site-nav" aria-label="Primary">
    <ul>
      {%- for item in site.nav -%}
      {%- assign cur = page.url | default: "/" -%}
      <li><a href="{{ item.url }}"{% if cur == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {%- endfor -%}
    </ul>
  </nav>
</header>
