<p>Publications are generated from a single BibTeX source. Use the controls to
filter by type or change the sort order. Everything stays visible with
JavaScript disabled.</p>

  <button class="chip" type="button" data-filter="article" aria-pressed="false">Journal</button>
  <button class="chip" type="button" data-filter="patent" aria-pressed="false">Patent</button>
  <button class="chip" type="button" data-filter="incollection" aria-pressed="false">Book chapter</button>
  <button class="chip" type="button" data-filter="book" aria-pressed="false">Book</button>
  <button class="chip" type="button" data-filter="techreport" aria-pressed="false">Tech report</button>
