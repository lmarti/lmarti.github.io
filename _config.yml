title: Luis Martí
email: luis_marti@dkl.digital
description: >-
  Personal academic site of Luis Martí — research, publications, and CV.
url: "https://lmarti.github.io"
baseurl: ""

highlighter: rouge
markdown: kramdown

plugins:
  - jekyll-scholar

# Internal site navigation (renamed from upstream typewriter `links:` per D003).
nav:
  - title: Home
    url: /
  - title: Publications
    url: /publications/
  - title: CV
    url: /cv/
  - title: Blog
    url: /blog/
  - title: Contact
    url: /contact/

# jekyll-scholar: render _bibliography/luis.bib server-side into /publications/.
scholar:
  source: _bibliography
  bibliography: luis.bib
  bibliography_template: bibliography
  style: apa
  sort_by: year
  order: descending
  bibliography_list_tag: ul
  bibliography_class: publications
  bibliography_item_tag: li

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .agents
  - .gsd
  - .gsd-id
  - .bg-shell
  - skills-lock.json
  - vendor
